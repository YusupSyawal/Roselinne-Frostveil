version: "3.9"

services:
  roselinne:
    build: .
    image: roselinne-frostveil:latest
    container_name: roselinne-frostveil
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist the SQLite database across container restarts
      - ./data:/app/data
      - ./logs:/app/logs
    # No ports needed — Discord bots connect outbound only
